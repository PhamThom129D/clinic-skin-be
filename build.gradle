plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // ====== Spring Boot Core Starters ======
    implementation 'org.springframework.boot:spring-boot-starter-web'         // REST API, Web MVC
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'   // Thymeleaf template engine
    implementation 'org.springframework.boot:spring-boot-starter-security'    // Spring Security

    // ====== Oauth-google ======
    implementation 'com.google.api-client:google-api-client:2.5.0'
    implementation 'com.google.oauth-client:google-oauth-client:1.34.1'
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'

    // ====== Spring Data ======
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'    // JPA & Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'   // Spring JDBC

    // ====== MySQL Driver ======
    runtimeOnly 'com.mysql:mysql-connector-j'

    // ====== Template Engine Extras ======
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // ====== JWT Dependencies ======
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // ====== Cloudinary SDK for Image Upload ======
    implementation 'com.cloudinary:cloudinary-http44:1.37.0'

    // ====== Lombok ======
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ====== Devtools ======
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ====== Testing ======
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ====== Send Mail ======
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // ====== Logger ======
    implementation 'org.slf4j:slf4j-api:2.0.12'

    // ====== Gemini API ======
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ====== MapStruct ======
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // ====== Validation ======
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'me.paulschwarz:spring-dotenv:3.0.0'

    // ====== WebSocket (real-time chat) ======
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
}

tasks.named('test') {
    useJUnitPlatform()
}
