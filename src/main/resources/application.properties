spring.application.name=Clinic_Skin_BE

# Port
server.port=1209

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# SQL init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Upload file
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.root=DEBUG

# Timezone
spring.jackson.time-zone=Asia/Ho_Chi_Minh
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Error messages
server.error.include-message=always
server.error.include-binding-errors=always

# Cloudinary
cloud_name=${CLOUD_NAME}
api_key=${CLOUD_API_KEY}
api_secret=${CLOUD_API_SECRET}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

# Google
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

# Gemini
gemini.api.keys=${GEMINI_API_KEYS}

