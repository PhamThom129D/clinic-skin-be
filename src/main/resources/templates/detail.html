<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${homeStay.name} + ' - Chi tiết'">Chi tiết Homestay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: .5rem;
        }
        .meta-item { font-size: .95rem; }
        .price-big { font-size: 1.6rem; font-weight: 700; color: #198754; }
        .btn-lg-wide { padding: .6rem 1.25rem; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">HomestayManager</a>
    </div>
</nav>

<div class="container my-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row gy-4">
                <div class="col-md-6">
                    <h2 class="mb-1" th:text="${homeStay.name}">Tên Homestay</h2>
                    <p class="text-muted mb-3">
                        <span class="me-3"><i class="bi bi-geo-alt-fill"></i>
                            <!-- xử lý an toàn trường city có thể null và tên property có thể khác -->
                            <span th:text="${homeStay.city != null ? (homeStay.city.cityName != null ? homeStay.city.cityName : (homeStay.city.cityName != null ? homeStay.city.cityName : 'Chưa có')) : 'Chưa có'}">
                                Thành phố
                            </span>
                        </span>
                    </p>

                    <div class="mb-3">
                        <div class="price-big" th:text="${homeStay.city.cityName}">0 $</div>
                        <div class="text-muted">Thành phố </div>
                    </div>

                    <div class="mb-3">
                        <div class="price-big" th:text="${homeStay.price + ' $'}">0 $</div>
                        <div class="text-muted">Giá / đêm (tham khảo)</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-6 meta-item">
                            <strong>Số phòng:</strong>
                            <div th:text="${homeStay.quantity_room != null ? homeStay.quantity_room : 0}">0</div>
                        </div>
                        <div class="col-6 meta-item">
                            <strong>Phòng có WC riêng:</strong>
                            <div th:text="${homeStay.quantity_room_wc != null ? homeStay.quantity_room_wc : 0}">0</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <strong>Mô tả</strong>
                        <p class="mt-2" th:text="${homeStay.description != null ? homeStay.description : 'Không có mô tả.'}">
                            Mô tả chi tiết homestay...
                        </p>
                    </div>

                    <div class="d-flex gap-2">
                        <a th:href="@{'/edit/' + ${homeStay.id}}" class="btn btn-warning btn-lg btn-lg-wide">Sửa</a>

                        <a th:href="@{/}" class="btn btn-secondary btn-lg btn-lg-wide ms-auto">Quay lại</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
