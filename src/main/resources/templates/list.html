<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Homestay</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3">Danh sách Homestay</h1>
    <a class="btn btn-success btn-lg" th:href="@{/add}">+ Thêm Homestay</a>
</div>

<table class="table table-bordered table-striped align-middle">
    <thead class="table-primary">
    <tr>
        <th>#</th>
        <th>Tên</th>
        <th>Thành phố</th>
        <th>Giá</th>
        <th class="text-center">Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="home, stat : ${homeStayList}">
        <td th:text="${home.id}"></td>
        <td>
            <a th:href="@{'/detail/' + ${home.id}}" th:text="${home.name}"
               class="fw-bold text-decoration-none text-primary"></a>
        </td>
        <td th:text="${home.city != null ? home.city.cityName : 'Chưa có'}"></td>
        <td th:text="${home.price}"></td>
        <td class="text-center">
            <a th:href="@{'/edit/' + ${home.id}}" class="btn btn-warning btn-lg me-2">Sửa</a>

            <!-- Nút mở modal -->
            <button type="button" class="btn btn-danger btn-lg"
                    data-bs-toggle="modal"
                    th:attr="data-bs-target=${'#deleteModal-' + home.id}">
                Xóa
            </button>

            <!-- Modal xác nhận xoá -->
            <div class="modal fade" th:id="${'deleteModal-' + home.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title">Xác nhận xoá</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            Bạn có chắc chắn muốn xoá homestay <strong th:text="${home.name}"></strong> không?
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                            <form th:action="@{'/delete/' + ${home.id}}" method="post">
                                <button type="submit" class="btn btn-danger">Xác nhận xoá</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End Modal -->
        </td>
    </tr>
    </tbody>
</table>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
