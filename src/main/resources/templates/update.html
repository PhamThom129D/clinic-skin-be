<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Homestay</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error {
            color: red;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-lg rounded-3">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:if="${homeStay.id != null}">Sửa thông tin Homestay</h4>
            <h4 class="mb-0" th:if="${homeStay.id == null}">Thêm mới Homestay</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/update}" th:object="${homeStay}" method="post" class="needs-validation" novalidate>
                <!-- hidden id -->
                <input type="hidden" th:field="*{id}"/>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên Homestay</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên homestay" required minlength="3">
                        <div class="invalid-feedback">Tên homestay tối thiểu 3 ký tự.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Thành phố</label>
                        <select th:field="*{city.id}" class="form-select" required>
                            <option value="">-- Chọn thành phố --</option>
                            <option th:each="c : ${cityList}"
                                    th:value="${c.id}"
                                    th:text="${c.cityName}">
                            </option>
                        </select>
                        <div class="invalid-feedback">Vui lòng chọn thành phố.</div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Số phòng</label>
                        <input type="number" th:field="*{quantity_room}" class="form-control" min="1" required>
                        <div class="invalid-feedback">Số phòng phải ≥ 1.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Số phòng có WC riêng</label>
                        <input type="number" th:field="*{quantity_room_wc}" class="form-control" min="1" required>
                        <div class="invalid-feedback">Số WC phải ≥ 1.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá ($)</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" min="1" required>
                        <div class="invalid-feedback">Giá phải lớn hơn 0.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea th:field="*{description}" class="form-control" rows="4"
                              placeholder="Nhập mô tả chi tiết về homestay..." required minlength="10"></textarea>
                    <div class="invalid-feedback">Mô tả tối thiểu 10 ký tự.</div>
                </div>

                <div class="d-flex justify-content-end">
                    <a th:href="@{/}" class="btn btn-secondary btn-lg me-2">Hủy</a>
                    <button type="submit" class="btn btn-primary btn-lg">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Bootstrap form validation
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
